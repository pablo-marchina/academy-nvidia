name: Apply Frontend Quality Gate Row

on:
  push:
    branches:
      - improve/dashboard-output-performance
    paths:
      - .github/workflows/apply-frontend-quality-gate-row.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance

      - name: Show central pipeline quality gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/PipelineFinalResultView.tsx')
          content = path.read_text(encoding='utf-8')
          anchor = '                { label: "Review readiness", value: quality?.review_readiness_score },\n'
          replacement = anchor + '                { label: "Pipeline quality gate", value: asRecord(workflowState.quality_gates_result).status },\n'
          if anchor not in content:
              raise SystemExit('Could not find quality grid anchor')
          content = content.replace(anchor, replacement, 1)
          path.write_text(content, encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/PipelineFinalResultView.tsx
          git commit -m "Show pipeline quality gate in final result"
          git push origin HEAD:improve/dashboard-output-performance
