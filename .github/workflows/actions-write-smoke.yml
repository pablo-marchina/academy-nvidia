name: Actions write smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/actions-write-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Write marker
        run: |
          printf '%s\n' 'actions-write-ok' > .github/actions-write-smoke-passed
          rm .github/workflows/actions-write-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actions-write-smoke-passed .github/workflows/actions-write-smoke.yml
          git commit -m "chore: confirm Actions write access"
          git push origin HEAD:main
