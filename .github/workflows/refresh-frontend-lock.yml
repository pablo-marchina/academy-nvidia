name: Refresh Frontend Lock

on:
  push:
    branches:
      - agent/final-release-integration

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-release-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lock with patched PostCSS
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact postcss@8.5.22
      - name: Commit generated manifest and lock
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "Frontend lock already contains the patched dependency."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore: update PostCSS security patch"
          git push origin HEAD:agent/final-release-integration
