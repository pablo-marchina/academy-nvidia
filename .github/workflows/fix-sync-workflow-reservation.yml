name: Fix synchronous workflow reservation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sync-workflow-reservation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reserve synchronous workflows before commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/orchestration/service.py')
          text = path.read_text(encoding='utf-8')

          old_signature = '''        use_rag: bool = True,
        graph_version: str = "1.0",
    ) -> Any:
'''
          new_signature = '''        use_rag: bool = True,
        graph_version: str = "1.0",
        initial_status: str = WorkflowStatus.QUEUED,
    ) -> Any:
'''
          if old_signature not in text:
              raise SystemExit('enqueue_workflow signature not found')
          text = text.replace(old_signature, new_signature, 1)

          old_validation = '''        if not any((startup_id, discovery_candidate_id, analysis_run_id)):
            raise ValueError("A startup_id, discovery_candidate_id, or analysis_run_id is required.")

        workflow_run = self.repo.create_workflow_run(
'''
          new_validation = '''        if not any((startup_id, discovery_candidate_id, analysis_run_id)):
            raise ValueError("A startup_id, discovery_candidate_id, or analysis_run_id is required.")
        if initial_status not in {WorkflowStatus.QUEUED, WorkflowStatus.RUNNING}:
            raise ValueError("initial_status must be queued or running.")

        workflow_run = self.repo.create_workflow_run(
'''
          if old_validation not in text:
              raise SystemExit('enqueue_workflow validation block not found')
          text = text.replace(old_validation, new_validation, 1)

          old_state = '''            analysis_run_id=analysis_run_id,
            status=WorkflowStatus.QUEUED,
            metadata_json={
'''
          new_state = '''            analysis_run_id=analysis_run_id,
            status=initial_status,
            metadata_json={
'''
          if old_state not in text:
              raise SystemExit('workflow state status block not found')
          text = text.replace(old_state, new_state, 1)

          old_persist = '''        workflow_run.state_json = state.model_dump(mode="json")
        self.session.commit()
        return workflow_run
'''
          new_persist = '''        workflow_run.status = initial_status
        if initial_status == WorkflowStatus.RUNNING:
            workflow_run.started_at = datetime.now(UTC)
        workflow_run.state_json = state.model_dump(mode="json")
        self.session.commit()
        return workflow_run
'''
          if old_persist not in text:
              raise SystemExit('workflow persistence block not found')
          text = text.replace(old_persist, new_persist, 1)

          old_sync = '''            use_rag=use_rag,
            graph_version=graph_version,
        )
        return self.run_existing_workflow(run.id)
'''
          new_sync = '''            use_rag=use_rag,
            graph_version=graph_version,
            initial_status=WorkflowStatus.RUNNING,
        )
        return self.run_existing_workflow(run.id)
'''
          if old_sync not in text:
              raise SystemExit('synchronous workflow call block not found')
          text = text.replace(old_sync, new_sync, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/unit/test_runtime_merge_regressions.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = '''


def test_synchronous_workflow_is_reserved_before_worker_can_claim_it() -> None:
    source = (ROOT / "src/orchestration/service.py").read_text(encoding="utf-8")
    assert "initial_status: str = WorkflowStatus.QUEUED" in source
    assert "initial_status=WorkflowStatus.RUNNING" in source
    status_position = source.index("workflow_run.status = initial_status")
    commit_position = source.index("self.session.commit()", status_position)
    assert status_position < commit_position
'''
          if 'test_synchronous_workflow_is_reserved_before_worker_can_claim_it' not in test_text:
              tests.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Validate repaired contracts
        shell: bash
        run: |
          python -m pip install --upgrade "pytest>=8,<9"
          python -m py_compile \
            src/orchestration/service.py \
            src/agents/search_planner.py \
            src/orchestration/node_impl.py \
            src/orchestration/worker.py \
            src/api/product_routes.py \
            src/services/product/radar_dashboard_service.py \
            tests/unit/test_runtime_merge_regressions.py
          python -m pytest -q tests/unit/test_runtime_merge_regressions.py

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/fix-sync-workflow-reservation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/orchestration/service.py \
            tests/unit/test_runtime_merge_regressions.py \
            .github/workflows/fix-sync-workflow-reservation.yml
          git commit -m "fix: reserve synchronous workflows before worker polling"
          git pull --rebase origin main
          git push origin HEAD:main
