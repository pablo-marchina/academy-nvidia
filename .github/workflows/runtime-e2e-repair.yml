name: Runtime E2E Repair

on:
  push:
    branches:
      - agent/runtime-e2e-repair
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: runtime-e2e-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply idempotent runtime repairs
        run: |
          python scripts/apply_runtime_repairs.py
          python scripts/apply_evidence_id_repair.py
          python scripts/apply_verifier_reason_repair.py
          python scripts/apply_activation_playbook_repair.py

      - name: Validate changed Python syntax
        run: |
          python -m compileall -q \
            scripts/apply_runtime_repairs.py \
            scripts/apply_evidence_id_repair.py \
            scripts/apply_verifier_reason_repair.py \
            scripts/apply_activation_playbook_repair.py \
            src/agents/extractor_agent.py \
            src/scraping/http_collector.py \
            src/orchestration/node_impl.py \
            src/diagnosis/gap_diagnosis_scoring.py \
            src/recommendation/recommendation_engine.py \
            tests/unit/test_runtime_repair_regressions.py \
            tests/unit/test_activation_playbook_abstention.py

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.12.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Check repaired code for executable lint failures
        run: |
          ruff check --select E9,F63,F7,F82 \
            scripts/apply_runtime_repairs.py \
            scripts/apply_evidence_id_repair.py \
            scripts/apply_verifier_reason_repair.py \
            scripts/apply_activation_playbook_repair.py \
            src/agents/extractor_agent.py \
            src/scraping/http_collector.py \
            src/orchestration/node_impl.py \
            src/diagnosis/gap_diagnosis_scoring.py \
            src/recommendation/recommendation_engine.py \
            tests/unit/test_runtime_repair_regressions.py \
            tests/unit/test_activation_playbook_abstention.py

      - name: Run repair regression tests
        run: |
          pytest -q \
            tests/unit/test_runtime_repair_regressions.py \
            tests/unit/test_activation_playbook_abstention.py \
            tests/unit/test_http_collector.py \
            tests/unit/test_radar_dashboard_runtime_gate.py \
            tests/unit/test_runtime_gap_evidence_integration.py

      - name: Install frontend dependencies with retries
        working-directory: frontend
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend locally
        working-directory: frontend
        run: npm run build

      - name: Prepare deterministic local product environment
        shell: bash
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path

          path = Path('.env')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'replace-with-a-random-value-of-at-least-32-characters': 'ci-internal-proxy-key-0123456789abcdef',
              'replace-with-a-random-database-password': 'ci-postgres-password-0123456789',
              'replace-with-a-random-qdrant-api-key': 'ci-qdrant-key-0123456789abcdef',
              'API_WORKERS=2': 'API_WORKERS=1',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          docker compose config --quiet

      - name: Build product containers with retry
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Docker build attempt ${attempt}/3"
            if docker compose build api workflow-worker frontend triton-reranker; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Start complete product stack
        run: docker compose up -d --force-recreate

      - name: Validate live runtime output
        shell: pwsh
        run: |
          ./scripts/verify_runtime_output.ps1 `
            -PipelineLimit 1 `
            -SkipRebuild `
            -RequestTimeoutSeconds 1800

      - name: Assert final persisted dashboard output
        shell: pwsh
        run: |
          $report = Get-Content ./final_case_evidence/local_runtime_output_validation.json -Raw | ConvertFrom-Json
          if ($report.status -ne "passed") {
            throw "Runtime report did not pass: $($report | ConvertTo-Json -Depth 30)"
          }
          $dashboard = Invoke-RestMethod -Method GET -Uri "http://localhost:3000/api/radar/dashboard?limit=100" -TimeoutSec 120
          if (@($dashboard.items).Count -lt 1 -or [int]$dashboard.analyzed_total -lt 1) {
            throw "Dashboard has no persisted analyzed output."
          }
          Write-Host "Final dashboard output validated: items=$(@($dashboard.items).Count) analyzed_total=$($dashboard.analyzed_total)"

      - name: Commit validated repairs
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No repair changes to commit."
            exit 0
          fi
          git config user.name "OpenAI Runtime Repair"
          git config user.email "runtime-repair@users.noreply.github.com"
          git add \
            src/agents/extractor_agent.py \
            src/scraping/http_collector.py \
            src/orchestration/node_impl.py \
            src/diagnosis/gap_diagnosis_scoring.py \
            src/recommendation/recommendation_engine.py \
            scripts/verify_runtime_output.ps1 \
            frontend/nginx.conf \
            frontend/Dockerfile \
            tests/unit/test_runtime_repair_regressions.py \
            tests/unit/test_activation_playbook_abstention.py
          git commit -m "fix: validate product runtime end to end"
          git push origin HEAD:agent/runtime-e2e-repair

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p final_case_evidence/runtime-e2e-ci
          docker compose ps -a > final_case_evidence/runtime-e2e-ci/compose-ps.txt 2>&1 || true
          docker compose logs --no-color api workflow-worker frontend triton-reranker postgres qdrant > final_case_evidence/runtime-e2e-ci/compose.log 2>&1 || true
          git diff > final_case_evidence/runtime-e2e-ci/uncommitted.patch || true

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-e2e-evidence-${{ github.run_id }}
          path: |
            final_case_evidence/local_runtime_output_validation.json
            final_case_evidence/runtime-e2e-ci/
          if-no-files-found: warn
          retention-days: 14
