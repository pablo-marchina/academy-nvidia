name: Apply Runtime Fix Temporary

on:
  push:
    branches:
      - improve/dashboard-output-performance

permissions:
  contents: write

concurrency:
  group: apply-runtime-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Assemble and apply patch
        run: |
          cat tools/runtime-fix-patch/patch_chunk_* | base64 -d | gzip -d > /tmp/runtime_fix.patch
          git apply --check /tmp/runtime_fix.patch
          git apply /tmp/runtime_fix.patch
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix frontend
      - name: Validate runtime fix
        run: |
          pytest -q \
            tests/unit/test_adaptive_source_planner.py \
            tests/unit/test_manual_seed_entity_signal.py \
            tests/unit/test_workload_classifier.py \
            tests/unit/test_activation_playbook_matcher.py \
            tests/unit/test_radar_dashboard_runtime_gate.py \
            tests/evals/test_recommendation_baseline.py
          npm run build --prefix frontend
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r tools/runtime-fix-patch
          git rm .github/workflows/apply-runtime-fix-temporary.yml
          git add .
          git commit -m "fix: make radar runtime faster and evidence-specific"
          git push origin HEAD:improve/dashboard-output-performance
