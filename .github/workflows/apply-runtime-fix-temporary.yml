name: Apply Runtime Fix Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-runtime-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply residual output-quality fixes
        run: python tools/apply_residual_fix.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix frontend
      - name: Validate residual fixes
        run: |
          pytest -q \
            tests/unit/test_workload_classifier.py \
            tests/unit/test_radar_relevant_gaps.py \
            tests/unit/test_activation_playbook_matcher.py \
            tests/unit/test_radar_dashboard_runtime_gate.py \
            tests/evals/test_recommendation_baseline.py
          npm run build --prefix frontend
      - name: Commit validated code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_residual_fix.py tools/trigger-residual-fix.txt
          git add \
            src/services/product/workload_classifier.py \
            src/services/product/radar_dashboard_service.py \
            tests/unit/test_radar_relevant_gaps.py
          git commit -m "fix: filter unsupported gaps and cover analytics workloads"
          git push origin HEAD:improve/dashboard-output-performance
