name: Apply Runtime Fix Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-runtime-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Assemble and apply patch
        run: |
          cat tools/runtime-fix-patch/patch_chunk_* | base64 -d | gzip -d > /tmp/runtime_fix.patch
          git apply --check /tmp/runtime_fix.patch
          git apply /tmp/runtime_fix.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('src/agents/search_planner.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          for index, line in enumerate(lines):
              if 'serpapi.com/search.json?q=' not in line:
                  continue
              indent = line[: len(line) - len(line.lstrip())]
              lines[index] = indent + '"https://serpapi.com/search.json?q=" + quote_plus(startup_name + " startup AI Brasil"),'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix frontend
      - name: Validate runtime fix
        run: |
          pytest -q \
            tests/unit/test_adaptive_source_planner.py \
            tests/unit/test_manual_seed_entity_signal.py \
            tests/unit/test_workload_classifier.py \
            tests/unit/test_activation_playbook_matcher.py \
            tests/unit/test_radar_dashboard_runtime_gate.py \
            tests/evals/test_recommendation_baseline.py
          npm run build --prefix frontend
      - name: Commit validated code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub Actions cannot push workflow-file changes with this token.
          # Keep the current CI workflow and let the connector update it later.
          git checkout HEAD -- .github/workflows/ci.yml
          git rm -r tools/runtime-fix-patch
          git add .
          git commit -m "fix: make radar runtime faster and evidence-specific"
          git push origin HEAD:improve/dashboard-output-performance
