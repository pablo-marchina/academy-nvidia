name: CI

on:
  push:

permissions:
  contents: write

jobs:
  apply-runtime-gap-context-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-release-integration
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply focused contract patch
        run: python scripts/apply_runtime_gap_context_contract_fix.py
      - name: Remove one-shot helper
        run: rm scripts/apply_runtime_gap_context_contract_fix.py
      - name: Commit non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/orchestration/node_impl.py tests/unit/test_runtime_gap_context_contract.py scripts/apply_runtime_gap_context_contract_fix.py
          git diff --cached --check
          git commit -m "fix: preserve runtime gap-context associations"
          git push origin HEAD:agent/final-release-integration
