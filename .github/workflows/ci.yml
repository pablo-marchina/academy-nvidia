name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-post-merge-runtime-files:
    if: github.head_ref == 'agent/post-merge-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore validated runtime template and runbook branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main improve/dashboard-output-performance
          git checkout -B repair origin/main
          git checkout origin/improve/dashboard-output-performance -- .env.example
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PRODUCTION_RUNBOOK.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('git checkout improve/dashboard-output-performance', 'git checkout main')
          path.write_text(text, encoding='utf-8')
          PY
          git add .env.example docs/PRODUCTION_RUNBOOK.md
          git diff --cached --check
          git commit -m "fix: align runtime configuration after branch merge"
          git push origin HEAD:main
