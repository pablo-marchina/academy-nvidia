name: CI

on:
  push:

permissions:
  contents: write

jobs:
  apply-activation-refresh-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-release-integration
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply focused patch
        run: python scripts/apply_activation_refresh_and_test_fixture_fix.py
      - name: Remove one-shot helper
        run: rm scripts/apply_activation_refresh_and_test_fixture_fix.py
      - name: Commit non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/orchestration/node_impl.py tests/unit/test_mapping_selected_scope_contract.py tests/unit/test_activation_playbook_session_refresh.py scripts/apply_activation_refresh_and_test_fixture_fix.py
          git diff --cached --check
          git commit -m "fix: refresh persisted activation inputs before playbook matching"
          git push origin HEAD:agent/final-release-integration
