name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-evidence-contract-fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/improve/dashboard-output-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance
      - name: Repair extraction-to-validation contract once
        run: |
          if grep -q '"claim": canonical_claim' src/agents/extractor_agent.py; then
            echo "Evidence contract already repaired."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('src/agents/extractor_agent.py')
          content = path.read_text(encoding='utf-8')
          old_import = 'from src.extraction.schemas import Evidence, SourceType, StartupProfile\n'
          new_import = 'from src.extraction.schemas import ConfidenceLevel, Evidence, SourceType, StartupProfile\n'
          if old_import not in content:
              raise SystemExit('Could not find extraction schema import')
          content = content.replace(old_import, new_import, 1)
          old = '''    factuality: str = "observed" if text else "unknown"

    item: dict[str, Any] = {
        "evidence_id": str(uuid.uuid4()),
'''
          new = '''    factuality: str = "observed" if text else "unknown"
    primary_source = profile.sources[0] if profile.sources else None
    canonical_claim = (
        primary_source.claim
        if primary_source is not None and primary_source.claim
        else f"{profile.startup_name} shows evidence of {', '.join(profile.ai_signals[:3]) or 'AI activity'}."
    )
    canonical_quote = (
        primary_source.quote_or_evidence
        if primary_source is not None and primary_source.quote_or_evidence
        else snippet
    )
    canonical_confidence = (
        primary_source.confidence.value
        if primary_source is not None and hasattr(primary_source.confidence, "value")
        else ConfidenceLevel.from_score(conf).value
    )
    canonical_collected_at = (
        primary_source.collected_at.isoformat()
        if primary_source is not None
        else extracted_at
    )

    item: dict[str, Any] = {
        "evidence_id": str(uuid.uuid4()),
        "claim": canonical_claim,
        "quote_or_evidence": canonical_quote,
        "confidence": canonical_confidence,
'''
          if old not in content:
              raise SystemExit('Could not find extraction evidence anchor')
          content = content.replace(old, new, 1)
          content = content.replace('        "collected_at": extracted_at,\n', '        "collected_at": canonical_collected_at,\n', 1)
          path.write_text(content, encoding='utf-8')
          PY
          cat > tests/unit/test_extractor_evidence_contract.py <<'PY'
          from __future__ import annotations

          from datetime import UTC, datetime

          from src.agents.extractor_agent import _build_evidence_item
          from src.extraction.schemas import ConfidenceLevel, Evidence, SourceType, StartupProfile


          def test_extracted_evidence_envelope_satisfies_canonical_contract() -> None:
              canonical = Evidence(
                  claim="Pix Force develops computer-vision systems for industrial inspection.",
                  source_url="https://pixforce.com/",
                  source_type=SourceType.OFFICIAL_SITE,
                  quote_or_evidence="The official site describes AI systems that interpret images and videos.",
                  confidence=ConfidenceLevel.HIGH,
                  collected_at=datetime.now(UTC),
              )
              profile = StartupProfile(
                  startup_name="Pix Force",
                  website="https://pixforce.com/",
                  country="Brazil",
                  sector="Computer Vision",
                  description="Industrial computer-vision company.",
                  product_summary="AI inspection systems.",
                  ai_signals=["computer vision", "artificial intelligence"],
                  sources=[canonical],
                  confidence_score=0.9,
              )
              item = _build_evidence_item(
                  {
                      "text": "Pix Force develops computer-vision systems for industrial inspection.",
                      "source_url": "https://pixforce.com/",
                      "source_id": "official-homepage",
                      "collected_at": datetime.now(UTC).isoformat(),
                  },
                  profile,
                  SourceType.OFFICIAL_SITE,
              )
              parsed = Evidence.model_validate(item)
              assert parsed.claim == canonical.claim
              assert parsed.quote_or_evidence == canonical.quote_or_evidence
              assert parsed.confidence is ConfidenceLevel.HIGH
              assert item["evidence_id"]
              assert item["text"]
              assert item["source_id"] == "official-homepage"
          PY
          python -m compileall -q src/agents/extractor_agent.py tests/unit/test_extractor_evidence_contract.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/agents/extractor_agent.py tests/unit/test_extractor_evidence_contract.py
          git commit -m "Fix canonical runtime evidence contract"
          git push origin HEAD:improve/dashboard-output-performance

  product-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install and audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Repository artifact gate
        run: python scripts/check_no_tracked_runtime_artifacts.py
      - name: Runtime gates
        run: |
          python scripts/check_single_runtime_pipeline.py
          python scripts/check_no_mock_runtime.py
          python scripts/build_runtime_usage_inventory.py --output final_case_evidence/runtime_usage_inventory.csv
          python scripts/build_best_case_runtime_report.py --inventory final_case_evidence/runtime_usage_inventory.csv --output final_case_evidence/best_case_runtime_report.json
          python scripts/audit_nvidia_corpus_freshness.py --fail-on-stale --fail-on-expired
      - name: Lint release-critical code
        run: |
          ruff check \
            src/api/main.py \
            src/api/workflow_routes.py \
            src/database/session.py \
            src/orchestration/runner.py \
            src/orchestration/service.py \
            src/orchestration/worker.py \
            src/repositories/workflow.py \
            src/services/product/health_executor.py \
            scripts/bootstrap_nvidia_corpus.py \
            scripts/refresh_nvidia_corpus_metadata.py \
            tests/unit/test_product_checkpointer_url.py \
            tests/unit/test_rag_ingestion_release_calibration.py \
            tests/unit/test_workflow_queue.py \
            tests/unit/test_health_executor_release.py
      - name: Focused tests
        run: |
          pytest -q \
            tests/unit/test_best_case_runtime_report.py \
            tests/unit/test_runtime_usage_inventory.py \
            tests/unit/test_ai_native_model.py \
            tests/unit/test_probabilistic_workflow_scoring.py \
            tests/unit/test_rag_technique_registry.py \
            tests/unit/test_rag_ingestion.py \
            tests/unit/test_rag_ingestion_release_calibration.py \
            tests/unit/test_rag_retrieval_intent.py \
            tests/unit/test_adaptive_source_planner.py \
            tests/unit/test_manual_seed_entity_signal.py \
            tests/unit/test_workload_classifier.py \
            tests/unit/test_radar_relevant_gaps.py \
            tests/unit/test_activation_playbook_matcher.py \
            tests/unit/test_radar_dashboard_runtime_gate.py \
            tests/unit/test_product_checkpointer_url.py \
            tests/unit/test_workflow_queue.py \
            tests/unit/test_health_executor_release.py \
            tests/evals/test_recommendation_baseline.py \
            tests/acceptance/test_no_mock_in_production.py
      - name: Verify Alembic upgrade and schema head
        run: |
          rm -f data/product/product.db
          python -m alembic upgrade head
          APP_MODE=test PRODUCT_DB_URL=sqlite:///data/product/product.db python - <<'PY'
          from src.database.session import assert_product_schema_current, build_product_database
          runtime = build_product_database("sqlite:///data/product/product.db")
          assert_product_schema_current(runtime.engine)
          print("Alembic schema is current")
          PY
      - name: Validate production Compose model
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build frontend
        working-directory: frontend
        run: npm run build
