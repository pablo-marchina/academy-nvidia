name: Export Source Temporary

on:
  push:
    branches:
      - improve/dashboard-output-performance

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/academy-nvidia-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: academy-nvidia-source
          path: /tmp/academy-nvidia-source.tar.gz
          retention-days: 1
