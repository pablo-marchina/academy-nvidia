name: Runtime Diagnostic Temporary

on:
  push:
    branches:
      - improve/dashboard-output-performance
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runtime-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run bounded radar runtime diagnostic
        env:
          APP_MODE: test
          RAG_REQUIRED_FOR_PRODUCT: "false"
          RADAR_ENRICH_VERIFIED_SEEDS: ""
          RADAR_ANALYSIS_MAX_SOURCES: "5"
        run: |
          mkdir -p /tmp/radar-diagnostic
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import traceback
          from collections import Counter
          from pathlib import Path

          from src.database.session import configure_product_database
          from src.services.product.radar_dashboard_service import PopulateOptions, RadarDashboardService

          output = Path('/tmp/radar-diagnostic/result.json')
          report: dict[str, object] = {
              'configuration': {
                  'dashboard_limit': 100,
                  'source_limit': 0,
                  'analysis_source_cap': int(os.getenv('RADAR_ANALYSIS_MAX_SOURCES', '5')),
                  'pipeline_limits': [1, 3, 5],
              },
              'cases': [],
          }

          for pipeline_limit in (1, 3, 5):
              db_path = Path(f'/tmp/radar_runtime_diagnostic_{pipeline_limit}.db')
              db_path.unlink(missing_ok=True)
              runtime = configure_product_database(f'sqlite:///{db_path}')
              with runtime.session_factory() as session:
                  started = time.perf_counter()
                  try:
                      result = RadarDashboardService(session).populate(
                          PopulateOptions(
                              limit=100,
                              source_limit=0,
                              pipeline_limit=pipeline_limit,
                              run_pipeline=True,
                              force_rerun=True,
                          )
                      )
                      elapsed = time.perf_counter() - started
                      pipeline_results = result.get('pipeline_results', [])
                      dashboard = result.get('dashboard', {})
                      items = dashboard.get('items', [])

                      recommendation_counts = [
                          len(item.get('activation_recommendations') or [])
                          for item in items
                      ]
                      technology_counts = [
                          len(item.get('top_nvidia_technologies') or [])
                          for item in items
                      ]
                      company_names = [str(item.get('company_name') or '') for item in items]
                      source_counts = [int(item.get('source_count') or 0) for item in items]
                      invalid_recommendation_rows = [
                          {
                              'company_name': item.get('company_name'),
                              'recommendation_count': len(item.get('activation_recommendations') or []),
                              'technology_count': len(item.get('top_nvidia_technologies') or []),
                          }
                          for item in items
                          if len(item.get('activation_recommendations') or []) > 2
                          or len(item.get('top_nvidia_technologies') or []) > 5
                      ]
                      medical_without_imaging = [
                          str(item.get('company_name') or '')
                          for item in items
                          if any(
                              tech in {'NVIDIA Clara', 'MONAI'}
                              for tech in (item.get('top_nvidia_technologies') or [])
                          )
                          and not any(
                              phrase in json.dumps(item.get('information') or {}, ensure_ascii=False).casefold()
                              for phrase in ('medical imaging', 'radiology', 'pathology', 'tomography', 'mri', 'x-ray')
                          )
                      ]

                      case = {
                          'pipeline_limit': pipeline_limit,
                          'elapsed_seconds': round(elapsed, 4),
                          'discovery_results': result.get('discovery_results', []),
                          'promoted_count': len(result.get('promoted_candidates', [])),
                          'pipeline_count': len(pipeline_results),
                          'pipeline_statuses': dict(Counter(str(item.get('status')) for item in pipeline_results)),
                          'pipeline_errors': [item for item in pipeline_results if item.get('status') == 'failed'][:10],
                          'dashboard_total': dashboard.get('total'),
                          'dashboard_analyzed_total': dashboard.get('analyzed_total'),
                          'company_names': company_names,
                          'unique_company_names': len({name.casefold() for name in company_names if name}),
                          'recommendation_counts': recommendation_counts,
                          'technology_counts': technology_counts,
                          'source_counts': source_counts,
                          'invalid_recommendation_rows': invalid_recommendation_rows,
                          'medical_without_imaging': medical_without_imaging,
                          'artifact_errors': [
                              item.get('artifact_errors')
                              for item in pipeline_results
                              if item.get('artifact_errors')
                          ],
                          'queue_count': len(result.get('discovery_queue', [])),
                          'rejected_count': len(result.get('rejected_entities', [])),
                          'dashboard_items': items,
                      }
                      report['cases'].append(case)
                      print(json.dumps(case, ensure_ascii=False, indent=2, default=str))
                  except Exception as exc:
                      elapsed = time.perf_counter() - started
                      case = {
                          'pipeline_limit': pipeline_limit,
                          'elapsed_seconds': round(elapsed, 4),
                          'exception': repr(exc),
                          'traceback': traceback.format_exc(),
                      }
                      report['cases'].append(case)
                      print(json.dumps(case, ensure_ascii=False, indent=2))
                      break

          output.write_text(json.dumps(report, ensure_ascii=False, indent=2, default=str), encoding='utf-8')
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-runtime-diagnostic
          path: /tmp/radar-diagnostic/
          if-no-files-found: warn
          retention-days: 2
