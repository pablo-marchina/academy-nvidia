name: Runtime Diagnostic Temporary

on:
  push:
    branches:
      - improve/dashboard-output-performance
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runtime-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run radar runtime diagnostic
        env:
          APP_MODE: test
          PRODUCT_DB_URL: sqlite:////tmp/radar_runtime_diagnostic.db
          RAG_REQUIRED_FOR_PRODUCT: "false"
          RADAR_ENRICH_VERIFIED_SEEDS: ""
        run: |
          mkdir -p /tmp/radar-diagnostic
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import traceback
          from collections import Counter
          from pathlib import Path

          from src.database.session import configure_product_database
          from src.services.product.radar_dashboard_service import PopulateOptions, RadarDashboardService

          output = Path('/tmp/radar-diagnostic/result.json')
          runtime = configure_product_database('sqlite:////tmp/radar_runtime_diagnostic.db')
          report: dict[str, object] = {'cases': []}

          for limit in (1, 3, 5):
              with runtime.session_factory() as session:
                  started = time.perf_counter()
                  try:
                      result = RadarDashboardService(session).populate(
                          PopulateOptions(
                              limit=limit,
                              source_limit=0,
                              run_pipeline=True,
                              force_rerun=True,
                          )
                      )
                      elapsed = time.perf_counter() - started
                      pipeline_results = result.get('pipeline_results', [])
                      dashboard = result.get('dashboard', {})
                      case = {
                          'limit': limit,
                          'elapsed_seconds': round(elapsed, 4),
                          'discovery_results': result.get('discovery_results', []),
                          'promoted_count': len(result.get('promoted_candidates', [])),
                          'pipeline_count': len(pipeline_results),
                          'pipeline_statuses': dict(Counter(str(item.get('status')) for item in pipeline_results)),
                          'pipeline_errors': [item for item in pipeline_results if item.get('status') == 'failed'][:10],
                          'dashboard_total': dashboard.get('total'),
                          'dashboard_analyzed_total': dashboard.get('analyzed_total'),
                          'dashboard_items': dashboard.get('items', []),
                          'queue_count': len(result.get('discovery_queue', [])),
                          'rejected_count': len(result.get('rejected_entities', [])),
                      }
                      report['cases'].append(case)
                      print(json.dumps(case, ensure_ascii=False, indent=2, default=str))
                  except Exception as exc:
                      elapsed = time.perf_counter() - started
                      case = {
                          'limit': limit,
                          'elapsed_seconds': round(elapsed, 4),
                          'exception': repr(exc),
                          'traceback': traceback.format_exc(),
                      }
                      report['cases'].append(case)
                      print(json.dumps(case, ensure_ascii=False, indent=2))
                      break

          output.write_text(json.dumps(report, ensure_ascii=False, indent=2, default=str), encoding='utf-8')
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-runtime-diagnostic
          path: /tmp/radar-diagnostic/
          if-no-files-found: warn
          retention-days: 2
