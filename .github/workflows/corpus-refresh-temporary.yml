name: Corpus Refresh Temporary

on:
  push:
    branches:
      - improve/dashboard-output-performance
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install refresh dependencies
        run: python -m pip install httpx PyYAML
      - name: Repair official sources that moved
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("data/nvidia_corpus/sources.yaml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8"))
          replacements = {
              "isaac": "https://docs.isaacsim.omniverse.nvidia.com/latest/index.html",
              "riva": "https://docs.nvidia.com/riva/index.html",
              "nvidia_whitepaper_rag": "https://developer.nvidia.com/topics/ai/retrieval-augmented-generation",
          }
          for source_id, url in replacements.items():
              payload["sources"][source_id]["url"] = url
          path.write_text(
              yaml.safe_dump(payload, default_flow_style=False, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          PY
      - name: Verify stale official sources and refresh metadata
        run: |
          python scripts/refresh_nvidia_corpus_metadata.py \
            --report-path corpus-refresh-report.json \
            --timeout-seconds 30
          python scripts/audit_nvidia_corpus_freshness.py \
            --fail-on-stale \
            --fail-on-expired \
            --report-path corpus-freshness-report.json
      - name: Commit verified source metadata
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- data/nvidia_corpus/sources.yaml; then
            echo "Corpus metadata already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvidia_corpus/sources.yaml
          git commit -m "Refresh verified NVIDIA corpus metadata"
          git push origin HEAD:improve/dashboard-output-performance
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-refresh-reports
          path: |
            corpus-refresh-report.json
            corpus-freshness-report.json
          if-no-files-found: error
