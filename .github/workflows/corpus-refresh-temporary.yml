name: Corpus Refresh Temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory corpus tooling
        run: find scripts data/nvidia_corpus -maxdepth 3 -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-refresh-snapshot
          path: |
            scripts
            data/nvidia_corpus
          if-no-files-found: error
