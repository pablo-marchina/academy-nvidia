name: Corpus Refresh Temporary

on:
  push:
    branches:
      - improve/dashboard-output-performance

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install refresh dependencies
        run: python -m pip install httpx PyYAML
      - name: Verify stale official sources and refresh metadata
        run: |
          python scripts/refresh_nvidia_corpus_metadata.py \
            --report-path corpus-refresh-report.json \
            --timeout-seconds 30
          python scripts/audit_nvidia_corpus_freshness.py \
            --fail-on-stale \
            --fail-on-expired \
            --report-path corpus-freshness-report.json
      - name: Commit freshness metadata when changed
        run: |
          if git diff --quiet -- data/nvidia_corpus/sources.yaml; then
            echo "Corpus metadata already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvidia_corpus/sources.yaml
          git commit -m "Refresh verified NVIDIA corpus metadata"
          git push origin HEAD:improve/dashboard-output-performance
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-refresh-reports
          path: |
            corpus-refresh-report.json
            corpus-freshness-report.json
          if-no-files-found: error
