name: Fix workflow runtime contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-workflow-runtime-contracts.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch orchestration contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/orchestration/service.py')
          text = service.read_text(encoding='utf-8')

          old_signature = '''        use_rag: bool = True,
        graph_version: str = "1.0",
    ) -> Any:
'''
          new_signature = '''        use_rag: bool = True,
        graph_version: str = "1.0",
        initial_status: str = WorkflowStatus.QUEUED,
    ) -> Any:
'''
          if old_signature not in text:
              raise SystemExit('enqueue_workflow signature contract not found')
          text = text.replace(old_signature, new_signature, 1)

          old_validation = '''        if not any((startup_id, discovery_candidate_id, analysis_run_id)):
            raise ValueError("A startup_id, discovery_candidate_id, or analysis_run_id is required.")

        workflow_run = self.repo.create_workflow_run(
'''
          new_validation = '''        if not any((startup_id, discovery_candidate_id, analysis_run_id)):
            raise ValueError("A startup_id, discovery_candidate_id, or analysis_run_id is required.")
        if initial_status not in {WorkflowStatus.QUEUED, WorkflowStatus.RUNNING}:
            raise ValueError("initial_status must be queued or running.")

        workflow_run = self.repo.create_workflow_run(
'''
          if old_validation not in text:
              raise SystemExit('enqueue_workflow validation contract not found')
          text = text.replace(old_validation, new_validation, 1)

          old_state = '''            analysis_run_id=analysis_run_id,
            status=WorkflowStatus.QUEUED,
            metadata_json={
'''
          new_state = '''            analysis_run_id=analysis_run_id,
            status=initial_status,
            metadata_json={
'''
          if old_state not in text:
              raise SystemExit('queued state contract not found')
          text = text.replace(old_state, new_state, 1)

          old_persist = '''        workflow_run.state_json = state.model_dump(mode="json")
        self.session.commit()
        return workflow_run
'''
          new_persist = '''        workflow_run.status = initial_status
        if initial_status == WorkflowStatus.RUNNING:
            workflow_run.started_at = datetime.now(UTC)
        workflow_run.state_json = state.model_dump(mode="json")
        self.session.commit()
        return workflow_run
'''
          if old_persist not in text:
              raise SystemExit('workflow persistence contract not found')
          text = text.replace(old_persist, new_persist, 1)

          old_sync_call = '''            use_rag=use_rag,
            graph_version=graph_version,
        )
        return self.run_existing_workflow(run.id)
'''
          new_sync_call = '''            use_rag=use_rag,
            graph_version=graph_version,
            initial_status=WorkflowStatus.RUNNING,
        )
        return self.run_existing_workflow(run.id)
'''
          if old_sync_call not in text:
              raise SystemExit('create_and_run_workflow call contract not found')
          text = text.replace(old_sync_call, new_sync_call, 1)
          service.write_text(text, encoding='utf-8')

          node_impl = Path('src/orchestration/node_impl.py')
          text = node_impl.read_text(encoding='utf-8')
          old_plan_prelude = '''    startup_name = ""
    website_url = ""
    if state.startup_id:
'''
          new_plan_prelude = '''    startup_name = ""
    website_url = ""
    known_source_urls: list[str] = []
    if state.startup_id:
'''
          marker = 'def node_plan_search(state: ProductWorkflowState) -> NodeResult:'
          start = text.find(marker)
          end = text.find('# ---------------------------------------------------------------------------\n# Node 3: collect_sources', start)
          if start < 0 or end < 0:
              raise SystemExit('node_plan_search boundaries not found')
          section = text[start:end]
          if old_plan_prelude not in section:
              raise SystemExit('node_plan_search prelude not found')
          section = section.replace(old_plan_prelude, new_plan_prelude, 1)
          old_startup = '''            if startup:
                startup_name = startup.name
                website_url = startup.website or ""
'''
          new_startup = '''            if startup:
                startup_name = startup.name
                website_url = startup.website or ""
                known_source_urls = [
                    str(evidence.source_url)
                    for evidence in (startup.evidence or [])
                    if str(evidence.source_url or "").startswith(("http://", "https://"))
                ]
'''
          if old_startup not in section:
              raise SystemExit('node_plan_search startup loading block not found')
          section = section.replace(old_startup, new_startup, 1)
          old_call = '    plan = build_search_plan(startup_name, website_url=website_url)\n'
          new_call = '''    plan = build_search_plan(
        startup_name,
        website_url=website_url,
        known_source_urls=known_source_urls,
    )
'''
          if old_call not in section:
              raise SystemExit('node_plan_search planner call not found')
          section = section.replace(old_call, new_call, 1)
          text = text[:start] + section + text[end:]
          node_impl.write_text(text, encoding='utf-8')

          worker = Path('src/orchestration/worker.py')
          text = worker.read_text(encoding='utf-8')
          old_worker = '''        with product_session() as session:
            WorkflowOrchestrationService(session).run_existing_workflow(workflow_id)
        logger.info("workflow_completed workflow_id=%s", workflow_id)
'''
          new_worker = '''        with product_session() as session:
            final_state = WorkflowOrchestrationService(session).run_existing_workflow(workflow_id)
        log = logger.error if final_state.status == "failed" else logger.info
        log(
            "workflow_finished workflow_id=%s status=%s current_node=%s",
            workflow_id,
            final_state.status,
            final_state.current_node,
        )
'''
          if old_worker not in text:
              raise SystemExit('worker completion logging contract not found')
          worker.write_text(text.replace(old_worker, new_worker, 1), encoding='utf-8')
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > tests/unit/test_runtime_merge_regressions.py <<'PYTEST'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          from src.agents.search_planner import build_search_plan


          ROOT = Path(__file__).resolve().parents[2]


          def test_search_planner_accepts_bounded_entity_specific_sources() -> None:
              plan = build_search_plan(
                  "Maritaca AI",
                  website_url="https://www.maritaca.ai/",
                  known_source_urls=[
                      "https://www.maritaca.ai/blog/modelos",
                      "https://startups.com.br/maritaca-ai",
                  ],
                  max_sources=2,
              )
              assert len(plan) == 2
              assert plan[0]["url"] == "https://www.maritaca.ai/"
              assert plan[0]["is_official_source"] is True
              assert all(item["url"].startswith(("http://", "https://")) for item in plan)


          def test_synchronous_workflow_is_reserved_before_first_commit() -> None:
              source = (ROOT / "src/orchestration/service.py").read_text(encoding="utf-8")
              tree = ast.parse(source)
              enqueue = next(
                  node
                  for node in ast.walk(tree)
                  if isinstance(node, ast.FunctionDef) and node.name == "enqueue_workflow"
              )
              argument_names = [argument.arg for argument in enqueue.args.args + enqueue.args.kwonlyargs]
              assert "initial_status" in argument_names
              assert "workflow_run.status = initial_status" in source
              assert "initial_status=WorkflowStatus.RUNNING" in source
              status_position = source.index("workflow_run.status = initial_status")
              commit_position = source.index("self.session.commit()", status_position)
              assert status_position < commit_position


          def test_search_node_reuses_persisted_evidence_urls() -> None:
              source = (ROOT / "src/orchestration/node_impl.py").read_text(encoding="utf-8")
              start = source.index("def node_plan_search")
              end = source.index("# Node 3: collect_sources", start)
              section = source[start:end]
              assert "known_source_urls" in section
              assert "startup.evidence" in section
              assert "known_source_urls=known_source_urls" in section


          def test_quality_report_datetime_dependency_is_imported() -> None:
              source = (ROOT / "src/api/product_routes.py").read_text(encoding="utf-8")
              assert "from datetime import UTC, datetime" in source


          def test_worker_has_process_healthcheck_and_truthful_terminal_log() -> None:
              compose = (ROOT / "docker-compose.yml").read_text(encoding="utf-8")
              worker = (ROOT / "src/orchestration/worker.py").read_text(encoding="utf-8")
              assert "b'src.orchestration.worker'" in compose
              assert "workflow_finished" in worker
              assert "workflow_completed workflow_id=%s" not in worker


          def test_optional_unavailable_sources_are_non_blocking() -> None:
              radar = (ROOT / "src/services/product/radar_dashboard_service.py").read_text(encoding="utf-8")
              assert 'status = "unavailable" if error.startswith("fetch_failed:") else "failed"' in radar
              assert '"blocking": status == "failed"' in radar

              sources = json.loads((ROOT / "src/config/discovery_sources.json").read_text(encoding="utf-8"))
              by_id = {item["source_id"]: item for item in sources}
              assert by_id["open_startups_ecosystem"]["enabled_by_default"] is True
              for source_id in (
                  "cubo_ecosystem",
                  "bossa_invest_portfolio",
                  "inovativa_startups",
                  "distrito_startup_programs",
              ):
                  assert by_id[source_id]["enabled_by_default"] is False
          PYTEST

      - name: Verify syntax and regression contracts
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m py_compile \
            src/agents/search_planner.py \
            src/orchestration/service.py \
            src/orchestration/node_impl.py \
            src/orchestration/worker.py \
            src/api/product_routes.py \
            src/services/product/radar_dashboard_service.py \
            tests/unit/test_runtime_merge_regressions.py
          python -m pytest -q tests/unit/test_runtime_merge_regressions.py
          python - <<'PY'
          from src.agents.search_planner import build_search_plan
          result = build_search_plan(
              'Semantix',
              website_url='https://semantix.ai/',
              known_source_urls=['https://semantix.ai/blog/'],
              max_sources=2,
          )
          assert result
          assert result[0]['is_official_source'] is True
          assert len(result) <= 2
          print({'planner_smoke': 'passed', 'sources': len(result)})
          PY

      - name: Commit verified repairs
        shell: bash
        run: |
          rm .github/workflows/fix-workflow-runtime-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/orchestration/service.py \
            src/orchestration/node_impl.py \
            src/orchestration/worker.py \
            tests/unit/test_runtime_merge_regressions.py \
            .github/workflows/fix-workflow-runtime-contracts.yml
          git commit -m "fix: harden central workflow runtime contracts"
          git push origin HEAD:main
