name: Fix RAG embedding dimension

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-rag-embedding-dimension.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align production embedding dimension
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('src/quality/decision_calibration_registry.py')
          text = registry.read_text(encoding='utf-8')

          replacements = {
              'ingested 20 active documents into 84 Qdrant chunks with real 384-dimensional "\n        "all-MiniLM-L6-v2 embeddings and hash-matched the active sources.yaml allowlist.':
              'ingested 20 active documents into 84 Qdrant chunks with real 1024-dimensional "\n        "BAAI/bge-m3 embeddings and hash-matched the active sources.yaml allowlist.',
              'decision_id="rag.embedding_dimension_expected",\n            decision_name="RAG Ingestion: Expected Embedding Dimension",\n            decision_type=DecisionType.QUALITY_GATE,\n            current_value=384,':
              'decision_id="rag.embedding_dimension_expected",\n            decision_name="RAG Ingestion: Expected Embedding Dimension",\n            decision_type=DecisionType.QUALITY_GATE,\n            current_value=1024,',
              'value_origin="sentence-transformers/all-MiniLM-L6-v2 and live Qdrant ingestion",':
              'value_origin="BAAI/bge-m3 and production Qdrant configuration",',
              'notes="The live embedding provider and Qdrant collection both measured 384 dimensions.",':
              'notes="The configured BAAI/bge-m3 embedding provider and Qdrant collection use 1024 dimensions.",',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected registry text not found: {old[:100]}')
              text = text.replace(old, new, 1)
          registry.write_text(text, encoding='utf-8')

          test_path = Path('tests/unit/test_ingestion_calibration_contract.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_test = 'assert inventory["rag.embedding_dimension_expected"].current_value == 384'
          new_test = 'assert inventory["rag.embedding_dimension_expected"].current_value == 1024'
          if old_test not in test_text:
              raise SystemExit('Expected test assertion not found')
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Verify repaired contract
        shell: bash
        run: |
          python -m py_compile src/quality/decision_calibration_registry.py tests/unit/test_ingestion_calibration_contract.py
          grep -n 'rag.embedding_dimension_expected' -A5 src/quality/decision_calibration_registry.py
          grep -n 'embedding_dimension_expected' tests/unit/test_ingestion_calibration_contract.py

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-rag-embedding-dimension.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quality/decision_calibration_registry.py tests/unit/test_ingestion_calibration_contract.py .github/workflows/fix-rag-embedding-dimension.yml
          git commit -m "fix: align RAG readiness with bge-m3 dimension"
          git push origin HEAD:main
