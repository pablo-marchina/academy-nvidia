name: Fix verifier failure report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-verifier-failure-report.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make failure report overwrite stale evidence
        shell: pwsh
        run: |
          $path = "scripts/verify_runtime_output.ps1"
          $text = Get-Content $path -Raw
          $old = '    if (-not (Test-Path $reportPath) -or $KeepReportOnFailure) {'
          $new = '    if ($true) {'
          if (-not $text.Contains($old)) {
              throw "Expected failure-report guard was not found."
          }
          Set-Content -Path $path -Value $text.Replace($old, $new) -Encoding UTF8

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
          )
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-verifier-failure-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_runtime_output.ps1 .github/workflows/fix-verifier-failure-report.yml
          git commit -m "fix: persist current live runtime validation failures"
          git pull --rebase origin main
          git push origin HEAD:main
