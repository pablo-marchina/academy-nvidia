name: Security Hash Fix Temporary

on:
  push:
    branches:
      - improve/dashboard-output-performance
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance
      - name: Mark deterministic MD5 identifiers as non-security usage
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'scripts/ingest_nvidia_corpus.py': [
                  ('hashlib.md5(raw_text.encode("utf-8")).hexdigest()', 'hashlib.md5(raw_text.encode("utf-8"), usedforsecurity=False).hexdigest()'),
                  ('hashlib.md5(content.encode("utf-8")).hexdigest()', 'hashlib.md5(content.encode("utf-8"), usedforsecurity=False).hexdigest()'),
              ],
              'scripts/refresh_nvidia_corpus_metadata.py': [
                  ('hashlib.md5(path.read_text(encoding="utf-8").encode("utf-8")).hexdigest()', 'hashlib.md5(path.read_text(encoding="utf-8").encode("utf-8"), usedforsecurity=False).hexdigest()'),
              ],
              'scripts/sync_nvidia_sources.py': [
                  ('hashlib.md5(text.encode("utf-8")).hexdigest()', 'hashlib.md5(text.encode("utf-8"), usedforsecurity=False).hexdigest()'),
              ],
              'src/rag/claim_evidence_matrix.py': [
                  ('hashlib.md5(claim.encode()).hexdigest()', 'hashlib.md5(claim.encode(), usedforsecurity=False).hexdigest()'),
              ],
              'src/rag/dvc_golden_set_versioning.py': [
                  ('hashlib.md5(json.dumps([c.chunk_id for c in contexts], sort_keys=True).encode()).hexdigest()', 'hashlib.md5(json.dumps([c.chunk_id for c in contexts], sort_keys=True).encode(), usedforsecurity=False).hexdigest()'),
              ],
              'src/rag/prompt_snapshotting.py': [
                  ('hashlib.md5("".join(c.content[:50] for c in contexts).encode()).hexdigest()', 'hashlib.md5("".join(c.content[:50] for c in contexts).encode(), usedforsecurity=False).hexdigest()'),
              ],
              'src/rag/qdrant_store.py': [
                  ('hashlib.md5(entry.content.encode("utf-8")).hexdigest()', 'hashlib.md5(entry.content.encode("utf-8"), usedforsecurity=False).hexdigest()'),
              ],
              'src/rag/report_versioning.py': [
                  ('hashlib.md5(json.dumps([c.chunk_id for c in contexts], sort_keys=True).encode()).hexdigest()', 'hashlib.md5(json.dumps([c.chunk_id for c in contexts], sort_keys=True).encode(), usedforsecurity=False).hexdigest()'),
              ],
              'src/rag/source_deduplication.py': [
                  ('hashlib.md5(ctx.content.encode()).hexdigest()', 'hashlib.md5(ctx.content.encode(), usedforsecurity=False).hexdigest()'),
              ],
          }

          changed = 0
          for filename, pairs in replacements.items():
              path = Path(filename)
              content = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = content.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one occurrence, found {count}: {old}')
                  content = content.replace(old, new, 1)
                  changed += 1
              path.write_text(content, encoding='utf-8')
          if changed != 10:
              raise SystemExit(f'Expected 10 changes, applied {changed}')
          PY
      - name: Verify high-severity Bandit findings are gone
        run: |
          python -m pip install 'bandit>=1.8,<2'
          bandit -q -r src scripts -lll
      - name: Commit compatibility hash annotations
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ingest_nvidia_corpus.py scripts/refresh_nvidia_corpus_metadata.py scripts/sync_nvidia_sources.py src/rag/claim_evidence_matrix.py src/rag/dvc_golden_set_versioning.py src/rag/prompt_snapshotting.py src/rag/qdrant_store.py src/rag/report_versioning.py src/rag/source_deduplication.py
          git commit -m 'Mark compatibility hashes as non-security identifiers'
          git push origin HEAD:improve/dashboard-output-performance
