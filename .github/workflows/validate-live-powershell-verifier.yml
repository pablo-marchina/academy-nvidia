name: Validate live PowerShell verifier

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-live-powershell-verifier.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize PowerShell continuations
        shell: pwsh
        run: |
          $path = "scripts/verify_runtime_output.ps1"
          $text = Get-Content $path -Raw
          $text = $text.Replace(" \`n", " ```n")
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Parse verifier
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "scripts/verify_runtime_output.ps1"),
              [ref]$tokens,
              [ref]$errors
          )
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
          Write-Host "PowerShell parser validation passed."

      - name: Commit normalized verifier and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/validate-live-powershell-verifier.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_runtime_output.ps1 .github/workflows/validate-live-powershell-verifier.yml
          git commit -m "test: validate live PowerShell runtime verifier"
          git pull --rebase origin main
          git push origin HEAD:main
