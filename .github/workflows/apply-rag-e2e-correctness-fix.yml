name: Apply RAG E2E Correctness Fix

on:
  push:
    branches:
      - improve/dashboard-output-performance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/dashboard-output-performance
          fetch-depth: 0

      - name: Apply correctness patch
        run: python scripts/apply_rag_e2e_correctness_fix.py

      - name: Run focused tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q \
            tests/unit/test_rag_e2e_output_contract.py \
            tests/unit/test_radar_relevant_gaps.py \
            tests/unit/test_workload_classifier.py

      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply_rag_e2e_correctness_fix.py
          rm -f .github/workflows/apply-rag-e2e-correctness-fix.yml

      - name: Commit and push fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Validate production RAG output end to end'
          git push origin HEAD:improve/dashboard-output-performance
