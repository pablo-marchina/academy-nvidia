name: Apply Persisted Live Diagnostics

on:
  push:
    branches:
      - agent/final-release-integration

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-release-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused patch
        run: python scripts/apply_live_persisted_state_diagnostics.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_live_persisted_state_diagnostics.py
          rm .github/workflows/apply-live-persisted-state-diagnostics.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: include persisted state in live validation artifacts"
          git push origin HEAD:agent/final-release-integration
