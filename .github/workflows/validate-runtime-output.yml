name: Validate runtime output

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-runtime-output.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install verification tools
        run: python -m pip install --upgrade "pytest>=8,<9" "ruff>=0.9,<1" "pydantic>=2.10,<3"

      - name: Check Python syntax and undefined names
        run: |
          python -m compileall -q \
            src/agents/search_planner.py \
            src/orchestration/node_impl.py \
            src/api/product_routes.py \
            src/services/product/radar_dashboard_service.py \
            src/orchestration/worker.py \
            tests/unit/test_runtime_merge_regressions.py
          ruff check --select F821,F822,F823 \
            src/agents/search_planner.py \
            src/orchestration/node_impl.py \
            src/api/product_routes.py \
            src/services/product/radar_dashboard_service.py \
            src/orchestration/worker.py

      - name: Run runtime regression tests
        run: pytest -q tests/unit/test_runtime_merge_regressions.py

      - name: Validate Docker Compose contract
        env:
          POSTGRES_PASSWORD: validation-password
          QDRANT_API_KEY: validation-qdrant-key
          INTERNAL_PROXY_KEY: validation-internal-proxy-key-1234567890
        run: docker compose config --quiet

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Write validation evidence
        if: success()
        run: |
          mkdir -p final_case_evidence
          cat > final_case_evidence/runtime_output_validation.json <<'JSON'
          {
            "status": "passed",
            "validated_commit": "${{ github.sha }}",
            "checks": {
              "python_compile": "passed",
              "undefined_names": "passed",
              "runtime_regression_tests": "passed",
              "docker_compose_config": "passed",
              "frontend_production_build": "passed"
            },
            "scope": "source, regression, compose and frontend build validation; local live services require the release verification PowerShell script"
          }
          JSON

      - name: Commit evidence and remove one-shot workflow
        if: success()
        run: |
          rm .github/workflows/validate-runtime-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f final_case_evidence/runtime_output_validation.json
          git add .github/workflows/validate-runtime-output.yml
          git commit -m "test: verify repaired runtime output contracts"
          git pull --rebase origin main
          git push origin HEAD:main
