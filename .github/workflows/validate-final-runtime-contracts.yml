name: Validate final runtime contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-final-runtime-contracts.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install validation tools
        run: python -m pip install --upgrade "pytest>=8,<9" "ruff>=0.9,<1"

      - name: Validate Python runtime contracts
        run: |
          python -m compileall -q \
            src/agents/search_planner.py \
            src/orchestration/service.py \
            src/orchestration/node_impl.py \
            src/orchestration/worker.py \
            src/api/product_routes.py \
            src/services/product/radar_dashboard_service.py \
            tests/unit/test_runtime_merge_regressions.py
          ruff check --select F821,F822,F823 \
            src/agents/search_planner.py \
            src/orchestration/service.py \
            src/orchestration/node_impl.py \
            src/orchestration/worker.py \
            src/api/product_routes.py \
            src/services/product/radar_dashboard_service.py
          pytest -q tests/unit/test_runtime_merge_regressions.py

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: validation-password
          QDRANT_API_KEY: validation-qdrant-key
          INTERNAL_PROXY_KEY: validation-internal-proxy-key-1234567890
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Persist validation evidence
        run: |
          mkdir -p final_case_evidence
          cat > final_case_evidence/final_runtime_contract_validation.json <<JSON
          {
            "status": "passed",
            "validated_commit": "${GITHUB_SHA}",
            "checks": {
              "python_compile": "passed",
              "undefined_names": "passed",
              "runtime_regression_tests": "passed",
              "docker_compose_config": "passed",
              "frontend_production_build": "passed"
            },
            "live_validation_command": "powershell -ExecutionPolicy Bypass -File scripts/verify_runtime_output.ps1 -PipelineLimit 1"
          }
          JSON

      - name: Commit evidence and remove workflow
        run: |
          rm .github/workflows/validate-final-runtime-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f final_case_evidence/final_runtime_contract_validation.json
          git add .github/workflows/validate-final-runtime-contracts.yml
          git commit -m "test: validate final runtime contracts"
          git pull --rebase origin main
          git push origin HEAD:main
