name: nvidia-startup-ai-radar

x-backend-environment: &backend-environment
  APP_MODE: product
  API_AUTH_MODE: internal_proxy
  INTERNAL_PROXY_KEY: ${INTERNAL_PROXY_KEY:?Set INTERNAL_PROXY_KEY in .env}
  PRODUCT_DB_URL: postgresql+psycopg2://radar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/nvidia_radar
  LANGGRAPH_CHECKPOINTER: postgres
  LANGGRAPH_POSTGRES_URL: postgresql://radar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/nvidia_radar
  AGENT_ORCHESTRATION_ENABLED: "true"
  RAG_REQUIRED_FOR_PRODUCT: "true"
  RAG_VECTOR_BACKEND: qdrant
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nvidia_corpus}
  QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
  QDRANT_MIN_POINTS: ${QDRANT_MIN_POINTS:-10}
  RERANKER_PROVIDER: triton
  TRITON_RERANKER_ENABLED: "true"
  TRITON_RERANKER_REQUIRED: "true"
  TRITON_RERANKER_URL: http://triton-reranker:8000/v2/models/cross_encoder/infer
  TRITON_RERANKER_HEALTH_URL: http://triton-reranker:8000/v2/models/cross_encoder/ready
  PRODUCT_DATA_DIR: /app/data/product
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

x-backend-service: &backend-service
  image: academy-nvidia-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    <<: *backend-environment
  networks:
    - startup-radar-net

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: nvidia_radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d startup_radar"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - startup-radar-net

  qdrant:
    image: qdrant/qdrant:v1.18.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - startup-radar-net

  triton-reranker:
    build:
      context: .
      dockerfile: Dockerfile.triton-reranker
    image: academy-nvidia/triton-reranker:24.06
    container_name: startup-radar-triton-reranker
    command: ["tritonserver", "--model-repository=/models", "--model-control-mode=explicit", "--load-model=cross_encoder"]
    environment:
      CE_MODEL_NAME: cross-encoder/ms-marco-MiniLM-L-6-v2
    ports:
      - "8100:8000"
      - "8101:8001"
      - "8102:8002"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - startup-radar-net

volumes:
  postgres_data:
  qdrant_data:
  product_data:
  model_cache:

networks:
  startup-radar-net:
    driver: bridge
